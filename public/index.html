  const [h, m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";

  return `${hour12}:${m.toString().padStart(2, "0")} ${period}`;
}

  if (digits.length < 7) return `(${digits.slice(0, 3)}) ${digits.slice(3)}`;
  return `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}`;
}

// Classic calendar-overlap layout: clusters mutually-overlapping bookings and
// assigns each a column so overlapping ones render side-by-side (Outlook-style).
function layoutOverlaps(bookings) {
  const sorted = [...bookings].sort((a, b) => a.start - b.start || a.end - b.end);
  const clusters = [];
  let current = [];
  let currentEnd = -Infinity;
  for (const ev of sorted) {
    if (current.length === 0 || ev.start < currentEnd) {
      current.push(ev);
      currentEnd = Math.max(currentEnd, ev.end);
    } else {
      clusters.push(current);
      current = [ev];
      currentEnd = ev.end;
    }
  }
  if (current.length) clusters.push(current);
  const layout = {};
  clusters.forEach((cluster, clusterIndex) => {
    const columnEnds = [];
    cluster.forEach(ev => {
      let placedCol = -1;
      for (let c = 0; c < columnEnds.length; c++) {
        if (columnEnds[c] <= ev.start) {
          placedCol = c;
          columnEnds[c] = ev.end;
          break;
        }
      }
      if (placedCol === -1) {
        placedCol = columnEnds.length;
        columnEnds.push(ev.end);
      }
      ev._col = placedCol;
    });
    const maxCols = columnEnds.length;
    cluster.forEach(ev => {
      layout[ev.id] = {
        col: ev._col,
        maxCols,
        clusterIndex
      };
    });
  });
  return layout;
}

// Convention: a selected window means the client is free start-to-finish
// within it — an appointment placed in this window must be able to finish
// before the window's end, not just start before it. Worth keeping in mind
// wherever availability eventually gets matched to a real appointment.
function groupSelectedRanges(times) {
  const sorted = [...times].sort((a, b) => a - b);
  const ranges = [];
  let rangeStart = null;
  let prev = null;
  for (const t of sorted) {
    if (rangeStart === null) {
      rangeStart = t;
      prev = t;
      continue;
    }
    if (t === prev + SLOT_MINUTES) {
      prev = t;
      continue;
    }
    ranges.push({
      start: rangeStart,
      end: prev + SLOT_MINUTES
    });
    rangeStart = t;
    prev = t;
  }
  if (rangeStart !== null) ranges.push({
    start: rangeStart,
    end: prev + SLOT_MINUTES
  });
  return ranges;
}
